</head><body><main class="wrap"><section class="hero"><h1>✨ JORON Magic Discovery</h1><p>আপনার নির্বাচিত Magic Feature অনুযায়ী Public Profile ফলাফল। নতুন Smart features-ও একই discovery engine ব্যবহার করে।</p><div id="mode" class="mode">লোড হচ্ছে…</div></section><section class="panel"><div class="filters"><div class="field"><label>🔎 সার্চ</label><input id="q" placeholder="নাম, সদস্য ID, জেলা, পেশা, শিক্ষা..."></div><div class="field"><label>👤 লিঙ্গ</label><select id="gender"><option value="">সব লিঙ্গ</option></select></div><div class="field"><label>🎂 বয়স</label><select id="age"><option value="">সব বয়স</option><option value="18-24">১৮–২৪</option><option value="25-29">২৫–২৯</option><option value="30-34">৩০–৩৪</option><option value="35-39">৩৫–৩৯</option><option value="40+">৪০+</option></select></div></div><div id="count" class="count">Profile লোড হচ্ছে...</div></section><section id="grid" class="grid"></section><div class="joron-global-page-nav"><a href="index.html">🏠 হোম</a><button type="button" onclick="history.length>1?history.back():location.href='magic-features.html'">↩️ Back</button></div></main><script type="module">import{db,auth,onAuthStateChanged}from'./assets/firebase-client.js';import{collection,getDocs,query,where,doc,getDoc}from'https://www.gstatic.com/firebasejs/12.16.0/firebase-firestore.js';const qs=new URLSearchParams(location.search),mode=(qs.get('mode')||'').toLowerCase(),grid=document.getElementById('grid'),count=document.getElementById('count'),q=document.getElementById('q'),gender=document.getElementById('gender'),age=document.getElementById('age'),modeEl=document.getElementById('mode');const labels={voice:'🎙️ Voice intro',new:'🆕 নতুন Profile',online:'🟢 Online সদস্য',foryou:'❤️ For You Match',nearby:'📍 Nearby',random:'🎲 Random Match',premium:'💎 Premium সদস্য',education:'🎓 Education',profession:'💼 Profession',status:'📢 Status',free:'🆓 Free সদস্য',religion:'🕌 Religion',astrology:'♈ Astrology',birthday:'🎂 Birthday',photoless:'🖼️ ছবি ছাড়া Profile',rel r!==tr&&!pr.includes(tr))return false;if(pd&&td&&pd!==td)return false;const score=(pg&&tg?25:0)+(pr&&tr?20:0)+(pd&&td?20:0)+(has(d,['education'])?10:0)+(has(d,['profession'])?10:0)+(photo(d)?10:0)+(truth(d,['verified','isVerified'])?5:0);x.__score=score;return has(d,['name','displayName','gender','age','district','profession','education','religion'])}case'savedsearch':{const s=localStorage.getItem('joron_saved_search');if(!s)return false;try{const p=JSON.parse(s);const okG=!p.gender||text(val(d,['gender']))===text(p.gender);const n=ageNum(d);const okA=(p.minAge==null||n>=Number(p.minAge))&&(p.maxAge==null||n<=Number(p.maxAge));const okD=!p.district||district(d)===text(p.district);return okG&&okA&&okD}catch{return false}}case'foryou':{if(sid===own())return false;return has(d,['name','displayName','gender','age','district','profession','education','religion'])}default:return true}}function hay(d){return [val(d,['name','displayName']),val(d,['memberId']),val(d,['district','currentDistrict','presentDistrict']),val(d,['profession','occupation','job']),val(d,['education','educationSystem','educationLevel','highestEducation','institution']),val(d,['religion']),val(d,['about','bio','description']),val(d,['country','currentCountry'])].join(' ').toLowerCase()}function apply(all,me){const needle=text(q.value),g=text(gender.value),a=age.value;let list=all.filter(x=>{const d=x.data,n=ageNum(d);return x.id!==own()&&match(x,me)&&(!needle||hay(d).includes(needle))&&(!g||text(val(d,['gender']))===g)&&(!a||n!==null&&((a==='18-24'&&n>=18&&n<=24)||(a==='25-29'&&n>=25&&n<=29)||(a==='30-34'&&n>=30&&n<=34)||(a==='35-39'&&n>=35&&n<=39)||(a==='40+'&&n>=40)))});if(['random'].includes(mode))list.sort(()=>Math.random()-.5);if(['smartmatch','mymatches','daily'].includes(mode))list.sort((a,b)=>(b.__score||0)-(a.__score||0));if(mode==='daily')list=list.slice(0,10);if(mode==='new')list.sort((a,b)=>(toDate(val(b.data,['createdAt','created_at','registeredAt','registrationDate','joinedAt']))?.getTime()||0)-(toDate(val(a.data,['createdAt','created_at','registeredAt','registrationDate','joinedAt']))?.getTime()||0));if(mode==='active')list.sort((a,b)=>(toDate(val(b.data,['lastActiveAt','lastLoginAt','lastSeenAt','updatedAt','updated_at']))?.getTime()||0)-(toDate(val(a.data,['lastActiveAt','lastLoginAt','lastSeenAt','updatedAt','updated_at']))?.getTime()||0));count.textContent=`${list.length}টি Profile পাওয়া গেছে`;grid.innerHTML=list.map(x=>{const d=x.data,n=val(d,['name','displayName'])||'JORON User';return `<article class="card"><h2>${esc(n)} ${truth(d,['verified','isVerified','verifiedBadge'])?'✅':''}</h2><div class="meta">${esc(val(d,['age'])||'—')} বছর · ${esc(val(d,['gender'])||'—')}<br>📍 ${esc(val(d,['district','currentDistrict'])||'—')}<br>🎓 ${esc(val(d,['education','educationSystem','highestEducation'])||'—')}<br>💼 ${esc(val(d,['profession','occupation','job'])||'—')}</div><a class="btn" href="profile.html?id=${encodeURIComponent(x.id)}">প্রোফাইল দেখুন →</a></article>`}).join('')||'<div class="empty">💗 এই মুহূর্তে এই ধরনের কোনো Profile পাওয়া যায়নি।</div>'}async function load(){count.textContent='⏳ Public Profile লোড হচ্ছে...';grid.innerHTML='';try{const s=await getDocs(query(collection(db,'biodata'),where('visibility','==','public'))),all=[];s.forEach(x=>all.push({id:x.id,data:x.data()}));gender.innerHTML='<option value="">সব লিঙ্গ</option>';[...new Set(all.map(x=>val(x.data,['gender'])).filter(Boolean))].forEach(v=>gender.insertAdjacentHTML('beforeend',`<option value="${esc(v)}">${esc(v)}</option>`));let me=null;try{if(auth.currentUser){const r=await getDoc(doc(db,'biodata',auth.currentUser.uid));if(r.exists())me=r.data()}}catch(e){console.warn('own profile read skipped',e)}window.__joronMagicAll=all;window.__joronMagicMe=me;apply(all,me)}catch(e){console.error('JORON Magic Filter load error:',e);count.textContent='❌ Profile লোড করা যায়নি';grid.innerHTML='<div class="empty">Public Profile দেখাতে সমস্যা হচ্ছে। কিছুক্ষণ পর আবার চেষ্টা করুন।</div>'}}function
