<!doctype html>
<html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>JORON Admin — Payment Review</title><link rel="stylesheet" href="assets/joron-theme-2026.css"><style>body{background:#f7f0df;color:#33291f;font-family:"Noto Sans Bengali","Hind Siliguri",system-ui,sans-serif}.wrap{max-width:1050px;margin:auto;padding:24px 16px}.head,.card{background:#fffdf7;border:1px solid #d8bd7a;border-radius:20px;box-shadow:0 10px 26px rgba(150,110,50,.08)}.head{padding:22px;text-align:center}.head h1{margin:0;color:#80600b}.head p{color:#756b5d}.toolbar{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:18px 0}.btn{border:1px solid #d8bd7a;border-radius:12px;padding:11px 15px;background:#fffaf0;color:#73540b;font-weight:900;cursor:pointer}.btn.primary{background:#b18424;color:#fff}.list{display:grid;gap:14px}.card{padding:18px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}.item{padding:10px;border:1px solid #eadbb8;border-radius:11px;background:#fffaf0}.item small{display:block;color:#756b5d}.item strong{word-break:break-word}.actions{display:flex;gap:9px;margin-top:14px}.approve{background:#e9f8ef;border-color:#a7d5b5;color:#17643b}.reject{background:#fff0f0;border-color:#e2b2b2;color:#9b2525}.msg{margin:15px 0;padding:12px;border-radius:12px;text-align:center;font-weight:800;background:#fff8df;border:1px solid #e4c96f}.empty{padding:35px;text-align:center;color:#756b5d}.loading{text-align:center;padding:30px}@media(max-width:650px){.grid{grid-template-columns:1fr}.toolbar{align-items:stretch;flex-direction:column}.actions .btn{flex:1}}</style><style id="joron-brand-final-v3">
.site-header .brand,.site-header .brand>span:last-child,.brand{display:flex!important;align-items:center!important}
.site-header .brand{gap:0!important;min-width:0!important}
.site-header .brand-mark{display:none!important}
.site-header .brand>span:last-child{flex-direction:column!important;align-items:center!important;justify-content:center!important;text-align:center!important;min-width:150px!important;max-width:210px!important;overflow:hidden!important}
.site-header .brand strong{display:block!important;width:100%!important;font-size:40px!important;line-height:1!important;letter-spacing:2px!important;white-space:nowrap!important;text-align:center!important}
.site-header .brand small{display:block!important;width:100%!important;margin-top:5px!important;font-family:"Hind Siliguri","Noto Sans Bengali",system-ui,sans-serif!important;font-size:14px!important;line-height:1.25!important;font-weight:700!important;letter-spacing:0!important;color:var(--gold-deep)!important;white-space:nowrap!important;text-align:center!important;overflow:hidden!important;text-overflow:clip!important}
@media(max-width:650px){.site-header .brand>span:last-child{min-width:132px!important;max-width:180px!important}.site-header .brand strong{font-size:31px!important;letter-spacing:1.5px!important}.site-header .brand small{font-size:11px!important;margin-top:4px!important}}
@media(max-width:390px){.site-header .brand>span:last-child{min-width:120px!important;max-width:165px!important}.site-header .brand strong{font-size:28px!important}.site-header .brand small{font-size:10px!important}}
</style><link rel="stylesheet" href="assets/joron-polish-2026.css">
<link rel="stylesheet" href="assets/joron-global-2026.css?v=2026">
</head><body><main class="wrap"><section class="head"><h1>🔐 JORON Admin — Payment Verification</h1><p>শুধু অনুমোদিত Admin pending Membership Payment দেখতে ও approve/reject করতে পারবেন।</p></section><div class="toolbar"><strong id="who">Admin যাচাই হচ্ছে…</strong><button class="btn primary" id="refresh">↻ Pending Refresh</button></div><div id="message" class="msg" hidden></div><section id="list" class="list"><div class="loading">⏳ Pending Payment লোড হচ্ছে…</div></section></main><script type="module">import{auth,onAuthStateChanged,persistenceReady}from'./assets/firebase-client.js';const ADMIN_UID='PcDehBv4dYezeIPA6h0Peo9lpih2';const BASE='https://us-central1-joron-d7742.cloudfunctions.net';const list=document.getElementById('list'),msg=document.getElementById('message'),who=document.getElementById('who');let user=null;function show(text,good=false){msg.hidden=false;msg.textContent=text;msg.style.background=good?'#e9f8ef':'#fff8df';setTimeout(()=>msg.hidden=true,3500)}function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}async function token(){if(!user)throw Error('Login required');return user.getIdToken(true)}async function load(){if(!user){list.innerHTML='<div class="empty">Admin login প্রয়োজন।</div>';return}try{const t=await token();const r=await fetch(BASE+'/adminListPendingPayments',{headers:{Authorization:'Bearer '+t}});const d=await r.json();if(!r.ok||!d.ok)throw Error(d.error||'Could not load');const rows=d.payments||[];if(!rows.length){list.innerHTML='<div class="empty">🎉 কোনো Pending Payment নেই।</div>';return}list.innerHTML=rows.map(p=>`<article class="card"><div class="grid"><div class="item"><small>User ID</small><strong>${esc(p.uid)}</strong></div><div class="item"><small>Plan</small><strong>${esc(p.selectedPlan||'—')}</strong></div><div class="item"><small>Amount</small><strong>৳${esc(p.membershipPrice||'—')}</strong></div><div class="item"><small>Sender Number</small><strong>${esc(p.senderNumber||'—')}</strong></div><div class="item"><small>Transaction ID</small><strong>${esc(p.transactionId||'—')}</strong></div><div class="item"><small>Status</small><strong>🟡 Pending</strong></div></div><div class="actions"><button class="btn approve" data-action="approve" data-uid="${esc(p.uid)}">✅ Approve</button><button class="btn reject" data-action="reject" data-uid="${esc(p.uid)}">❌ Reject</button></div></article>`).join('')}catch(e){console.error(e);list.innerHTML='<div class="empty">⚠️ Payment list load করা যায়নি। Function deploy হয়েছে কি না যাচাই করুন।</div>';show(e.message||'Error')}}async function review(uid,action,button){if(!confirm(action==='approve'?'এই Payment Approve করবেন?':'এই Payment Reject করবেন?'))return;button.disabled=true;try{const t=await token();const r=await fetch(BASE+'/adminReviewPayment',{method:'POST',headers:{Authorization:'Bearer '+t,'Content-Type':'application/json'},body:JSON.stringify({uid,action})});const d=await r.json();if(!r.ok||!d.ok)throw Error(d.error||'Review failed');show(action==='approve'?'✅ Membership Active করা হয়েছে।':'❌ Payment Reject করা হয়েছে।',true);await load()}catch(e){button.disabled=false;console.error(e);show(e.message||'Review failed')}}list.addEventListener('click',e=>{const b=e.target.closest('button[data-action]');if(b)review(b.dataset.uid,b.dataset.action,b)});document.getElementById('refresh').onclick=load;await persistenceReady;onAuthStateChanged(auth,async u=>{user=u;if(!u){who.textContent='🔒 Login required';await load();return}if(u.uid!==ADMIN_UID){who.textContent='⛔ Admin access denied';list.innerHTML='<div class="empty">এই Account-এর Admin permission নেই।</div>';return}who.textContent='🟢 Admin authenticated';await load()});</script></body></html>
