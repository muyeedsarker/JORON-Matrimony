</head><body><main class="wrap"><div class="card"><a class="back" href="interests.html">← Interests</a><h1>💬 Free Chat</h1><div id="partner" class="muted">Connecting...</div><div id="messages" class="messages"></div><div class="composer"><input id="text" maxlength="1000" placeholder="বার্তা লিখুন..."/><button id="send" class="btn">Send</button></div><div id="status" class="muted"></div></div></main><script type="module">import{auth,onAuthStateChanged,persistenceReady}from'./assets/firebase-client.js';import{ensureChat,sendMessage,subscribeMessages}from'./assets/chat-service.js';const params=new URLSearchParams(location.search),otherUid=params.get('uid');const messages=document.getElementById('messages'),text=document.getElementById('text'),send=document.getElementById('send'),status=document.getElementById('status'),partner=document.getElementById('partner');let chatId=null,unsubscribe=null;const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function render(rows){messages.innerHTML=rows.map(x=>`<div class="msg ${x.senderId===auth.currentUser?.uid?'mine':''}">${esc(x.text)}</div>`).join('');messages.scrollTop=messages.scrollHeight}async function start(user){try{if(!otherUid||otherUid===user.uid)throw new Error('INVALID_PARTICIPANT');chatId=await ensureChat(otherUid);partner.textContent='❤️ Mutual Interest confirmed';unsubscribe=subscribeMessages(chatId,render)}catch(e){console.error(e);status.textContent=e.message==='MUTUAL_INTEREST_REQUIRED'?'💡 দুজনের Mutual Interest গ্রহণ হওয়ার পরই Free Chat চালু হবে।':'Chat চালু করা যায়নি।'}}send.onclick=async()=>{try{await sendMessage(chatId,text.value);text.value='';text.focus()}catch(e){console.error(e);status.textContent='বার্তা পাঠানো যায়নি।'}};text.addEventListener('keydown',e=>{if(e.key==='Enter')send.click()});await persistenceReady;onAuthStateChanged(auth,user=>{if(!user){location.replace('login.html?next=free-chat.html');return}start(user)});window.addEventListener('beforeunload',()=>unsubscribe?.());</script><style id="joron-global-page-nav-style">.joron-global-page-nav{width:100%;display:flex;gap:10px;justify-content:center;align-items:center;padding:14px 0 24px;margin:0 auto;clear:both}.joron-global-page-nav a,.joron-global-page-nav button{flex:1 1 0;max-width:360px;min-height:50px;display:flex;align-items:center;justify-content:center;padding:12px 16px;border:2px solid rgba(255,255,255,.9);border-radius:15px;color:#fff;background:linear-gradient(135deg,#087b59,#10a978);font:900 15px/1.2 "Noto Sans Bengali","Hind Siliguri",system-ui,sans-serif;text-decoration:none;cursor:pointer;box-shadow:0 8px 20px rgba(70,25,90,.18),inset 0 1px 0 rgba(255,255,255,.35);transition:.2s}.joron-global-page-nav button{background:linear-gradient(135deg,#64158f,#a13bc5)}.joron-global-page-nav a:hover,.joron-global-page-nav button:hover{transform:translateY(-2px);filter:brightness(1.06)}@media(max-width:600px){.joron-global-page-nav{gap:6px;padding:12px 2px 20px}.joron-global-page-nav a,.joron-global-page-nav button{min-height:48px;padding:11px 8px;font-size:13px;border-width:1.5px;border-radius:12px}}</style><div id="joron-global-page-nav" class="joron-global-page-nav" aria-label="JORON page navigation"><a href="index.html" class="joron-home-btn">🏠 হোম</a><button type="button" class="joron-back-btn" onclick="if(history.length>1){history.back()}else{location.href='index.html'}">↩️ Back</button></div></body></html>
