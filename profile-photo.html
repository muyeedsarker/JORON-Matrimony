</head><body><div class="top">📸 JORON Profile Photo • সুন্দর, সম্মানজনক ও নিরাপদ</div><div class="wrap nav"><a class="brand" href="index.html">JORON Matrimony</a><a class="back" href="profile.html">← Profile</a></div><main><section class="hero"><h1>📸 Profile Photo</h1><p>একটি পরিষ্কার ছবি দিন এবং আপনার পছন্দের ৫টি Style-এর একটি বেছে নিন।</p></section><section class="card"><div class="upload"><div class="preview" id="preview">👤</div><input id="file" type="file" accept="image/*"><div class="styles"><button class="style active" data-style="classic">Classic<small>পরিষ্কার</small></button><button class="style" data-style="elegant">Elegant<small>মার্জিত</small></button><button class="style" data-style="soft">Soft<small>নরম</small></button><button class="style" data-style="modern">Modern<small>আধুনিক</small></button><button class="style" data-style="modest">Modest<small>শালীন</small></button></div><button class="button" id="save">📤 Firebase-এ Photo সংরক্ষণ করুন</button><div class="status" id="status"></div><div class="hint">সর্বোচ্চ 5MB • JPG/PNG/WebP • আপনার Photo আপনার Profile-এর সঙ্গে সংরক্ষিত হবে।</div></div></section></main><script type="module">import { auth } from './assets/firebase-client.js';import { onAuthStateChanged } from 'https://www.gstatic.com/firebasejs/12.16.0/firebase-auth.js';import { uploadProfilePhoto } from './assets/photo-service.js';const file=document.getElementById('file'),preview=document.getElementById('preview'),status=document.getElementById('status');let style='classic',user=null;onAuthStateChanged(auth,u=>{user=u;if(!u)status.textContent='🔐 আগে Login করুন।'});file.onchange=()=>{const f=file.files[0];if(f){const url=URL.createObjectURL(f);preview.innerHTML=`<img src="${url}" alt="Preview">`}};document.querySelectorAll('.style').forEach(b=>b.onclick=()=>{document.querySelectorAll('.style').forEach(x=>x.classList.remove('active'));b.classList.add('active');style=b.dataset.style});document.getElementById('save').onclick=async()=>{if(!user){status.textContent='🔐 Login প্রয়োজন।';return}const f=file.files[0];if(!f){status.textContent='📷 আগে একটি ছবি নির্বাচন করুন।';return}status.textContent='⏳ Photo সংরক্ষণ হচ্ছে...';try{await uploadProfilePhoto(f,style);status.textContent='✅ Photo সফলভাবে Firebase-এ সংরক্ষণ হয়েছে।'}catch(e){console.error(e);status.textContent='❌ '+(e.message||'Photo সংরক্ষণ করা যায়নি।')}};</script><style id="joron-global-page-nav-style">.joron-global-page-nav{width:100%;display:flex;gap:10px;justify-content:center;align-items:center;padding:14px 0 24px;margin:0 auto;clear:both}.joron-global-page-nav a,.joron-global-page-nav button{flex:1 1 0;max-width:360px;min-height:50px;display:flex;align-items:center;justify-content:center;padding:12px 16px;border:2px solid rgba(255,255,255,.9);border-radius:15px;color:#fff;background:linear-gradient(135deg,#087b59,#10a978);font:900 15px/1.2 "Noto Sans Bengali","Hind Siliguri",system-ui,sans-serif;text-decoration:none;cursor:pointer;box-shadow:0 8px 20px rgba(70,25,90,.18),inset 0 1px 0 rgba(255,255,255,.35);transition:.2s}.joron-global-page-nav button{background:linear-gradient(135deg,#64158f,#a13bc5)}.joron-global-page-nav a:hover,.joron-global-page-nav button:hover{transform:translateY(-2px);filter:brightness(1.06)}@media(max-width:600px){.joron-global-page-nav{gap:6px;padding:12px 2px 20px}.joron-global-page-nav a,.joron-global-page-nav button{min-height:48px;padding:11px 8px;font-size:13px;border-width:1.5px;border-radius:12px}}</style><div id="joron-global-page-nav" class="joron-global-page-nav" aria-label="JORON page navigation"><a href="index.html" class="joron-home-btn">🏠 হোম</a><button type="button" class="joron-back-btn" onclick="if(history.length>1){history.back()}else{location.href='index.html'}">↩️ Back</button></div></body></html>
