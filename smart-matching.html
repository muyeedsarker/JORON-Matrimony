<!doctype html><html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>JORON Matrimony | Smart Matching</title><link rel="stylesheet" href="assets/joron-theme-2026.css"><style>body{background:#f7f0df}.wrap{width:min(1050px,94%);margin:auto}.top{background:#8a6500;color:#fff;text-align:center;padding:9px;font-weight:800}.nav{display:flex;justify-content:space-between;align-items:center;padding:16px 0}.brand{font:bold 30px Georgia;color:#8a6500;text-decoration:none}.nav a{padding:9px 14px;border:1px solid #d8bd7a;border-radius:12px;background:#fffaf0;text-decoration:none;font-weight:800;color:#76570c}.hero{text-align:center;padding:22px 0}.hero h1{font-size:38px;color:#80600b}.filters,.profile,.note{background:#fffdf7;border:1px solid #d8bd7a;border-radius:20px;padding:18px;box-shadow:0 10px 26px rgba(150,110,50,.08)}.filters{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.filters label{font-size:12px;font-weight:900;color:#80600b}.filters input,.filters select{width:100%;margin-top:6px;height:44px;border:1px solid #d8bd7a;border-radius:12px;padding:0 10px;background:#fff;font:inherit}.button{grid-column:1/-1;border:0;border-radius:13px;height:48px;background:#b18424;color:#fff;font-weight:900;cursor:pointer}.results{display:grid;grid-template-columns:repeat(3,1fr);gap:15px;margin:18px 0 30px}.avatar{height:130px;border-radius:16px;background:#fbf5e8;display:flex;align-items:center;justify-content:center;font-size:55px}.profile h2{margin:12px 0 4px;color:#80600b}.profile p{margin:4px 0;color:#756b5d;font-size:13px}.match{display:inline-block;margin-top:10px;padding:7px 10px;border-radius:999px;background:#f7edd4;color:#8a6500;font-weight:900;font-size:12px}.status{text-align:center;margin:14px 0;font-weight:800}.note{margin-bottom:25px;color:#756b5d;font-size:13px}@media(max-width:760px){.filters{grid-template-columns:1fr 1fr}.results{grid-template-columns:1fr 1fr}}@media(max-width:500px){.filters,.results{grid-template-columns:1fr}.hero h1{font-size:31px}}</style><style id="joron-brand-final-v3">
.site-header .brand,.site-header .brand>span:last-child,.brand{display:flex!important;align-items:center!important}
.site-header .brand{gap:0!important;min-width:0!important}
.site-header .brand-mark{display:none!important}
.site-header .brand>span:last-child{flex-direction:column!important;align-items:center!important;justify-content:center!important;text-align:center!important;min-width:150px!important;max-width:210px!important;overflow:hidden!important}
.site-header .brand strong{display:block!important;width:100%!important;font-size:40px!important;line-height:1!important;letter-spacing:2px!important;white-space:nowrap!important;text-align:center!important}
.site-header .brand small{display:block!important;width:100%!important;margin-top:5px!important;font-family:"Hind Siliguri","Noto Sans Bengali",system-ui,sans-serif!important;font-size:14px!important;line-height:1.25!important;font-weight:700!important;letter-spacing:0!important;color:var(--gold-deep)!important;white-space:nowrap!important;text-align:center!important;overflow:hidden!important;text-overflow:clip!important}
@media(max-width:650px){.site-header .brand>span:last-child{min-width:132px!important;max-width:180px!important}.site-header .brand strong{font-size:31px!important;letter-spacing:1.5px!important}.site-header .brand small{font-size:11px!important;margin-top:4px!important}}
@media(max-width:390px){.site-header .brand>span:last-child{min-width:120px!important;max-width:165px!important}.site-header .brand strong{font-size:28px!important}.site-header .brand small{font-size:10px!important}}
</style><link rel="stylesheet" href="assets/joron-polish-2026.css">
</head><body><div class="top">❤️ JORON Smart Matching • আপনার পছন্দ অনুযায়ী সম্ভাব্য সম্পর্ক</div><div class="wrap nav"><a class="brand" href="index.html">JORON Matrimony</a><a href="dashboard.html">🏠 Dashboard</a></div><main><section class="hero"><h1>❤️ Smart Matching</h1><p>আপনার Biodata ও preference-এর ভিত্তিতে সম্ভাব্য Match খুঁজুন।</p></section><section class="filters"><div><label>বয়স</label><input id="age" type="text" placeholder="যেমন 25-30"></div><div><label>জেলা</label><input id="location" type="text" placeholder="যেমন Gazipur"></div><div><label>শিক্ষা</label><select id="education"><option value="">সব</option><option>SSC</option><option>HSC</option><option>Graduate</option><option>Postgraduate</option></select></div><div><label>পেশা</label><input id="profession" type="text" placeholder="পছন্দের পেশা"></div><button class="button" id="match">🔎 বাস্তব Match খুঁজুন</button></section><div class="status" id="status">Login করে Match খুঁজুন।</div><section class="results" id="results"></section><div class="note">🤖 Match score একটি preference-based সহায়ক হিসাব; এটি সম্পর্ক বা সামঞ্জস্যের নিশ্চয়তা নয়।</div></main><script type="module">import{auth,db}from'./assets/firebase-client.js';import{onAuthStateChanged}from'https://www.gstatic.com/firebasejs/12.16.0/firebase-auth.js';import{doc,getDoc}from'https://www.gstatic.com/firebasejs/12.16.0/firebase-firestore.js';import{findMatches}from'./assets/matching-service.js';const results=document.getElementById('results'),status=document.getElementById('status');let user=null,profile=null;const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const render=items=>{results.innerHTML=items.length?items.map(x=>`<article class="profile"><div class="avatar">👤</div><h2>${esc(x.name||'JORON Member')}</h2><p>${esc(x.age?x.age+' বছর':'বয়স তথ্য নেই')} • ${esc(x.district||'জেলা নেই')}</p><p>${esc(x.education||'শিক্ষা নেই')} • ${esc(x.profession||'পেশা নেই')}</p><span class="match">⭐ ${x.score}% সম্ভাব্য Match</span></article>`).join(''):'<article class="profile"><h2>কোনো প্রকাশ্য Profile পাওয়া যায়নি</h2><p>আপনার preference পরিবর্তন করে আবার চেষ্টা করুন।</p></article>'};onAuthStateChanged(auth,async u=>{user=u;if(!u){status.textContent='🔐 আগে Login করুন।';return}try{const snap=await getDoc(doc(db,'biodata',u.uid));profile=snap.exists()?snap.data():{};status.textContent='';}catch(e){console.error(e);profile={};status.textContent='Profile data পাওয়া যায়নি; আবার চেষ্টা করুন।'}});document.getElementById('match').onclick=async()=>{if(!user){status.textContent='🔐 Match দেখতে Login প্রয়োজন।';return}status.textContent='🔎 বাস্তব Match খোঁজা হচ্ছে...';try{let items=await findMatches(user.uid,profile||{},100);const age=document.getElementById('age').value.trim(),loc=document.getElementById('location').value.trim().toLowerCase(),edu=document.getElementById('education').value.trim().toLowerCase(),job=document.getElementById('profession').value.trim().toLowerCase();if(loc)items=items.filter(x=>String(x.district||'').toLowerCase().includes(loc));if(edu)items=items.filter(x=>String(x.education||'').toLowerCase().includes(edu));if(job)items=items.filter(x=>String(x.profession||'').toLowerCase().includes(job));if(age){const m=age.match(/(\d+)\s*[-–]\s*(\d+)/);if(m){const a=+m[1],b=+m[2];items=items.filter(x=>Number(x.age)>=a&&Number(x.age)<=b)}}render(items);status.textContent=`✅ ${items.length}টি বাস্তব Match পাওয়া গেছে।`}catch(e){console.error(e);status.textContent='❌ Match খুঁজতে সমস্যা হয়েছে। Firebase/permission পরীক্ষা করুন।'}};</script></body></html>
