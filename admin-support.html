<!doctype html><html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>JORON Admin | Support Center</title><link rel="stylesheet" href="assets/joron-theme-2026.css"><link rel="stylesheet" href="assets/joron-polish-2026.css"><style>body{background:linear-gradient(135deg,#fff7fa,#f2fbf7);font-family:system-ui,"Noto Sans Bengali",sans-serif}.wrap{max-width:1100px;margin:auto;padding:24px 16px}.head,.card{background:#fff;border-radius:22px;padding:20px;box-shadow:0 10px 30px #0000000d}.head{margin-bottom:16px}.toolbar{display:flex;gap:10px;margin:14px 0}.toolbar select{padding:11px;border-radius:12px;border:1px solid #ddd}.list{display:grid;gap:14px}.ticket{border:1px solid #e8e8e8;border-radius:18px;padding:17px}.meta{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:10px 0}.meta div{background:#fafafa;padding:9px;border-radius:10px;font-size:13px}.ticket textarea{width:100%;min-height:90px;border:1px solid #ddd;border-radius:12px;padding:12px;font:inherit}.actions{display:flex;gap:8px;margin-top:10px}.btn{border:0;border-radius:12px;padding:10px 14px;font-weight:800;cursor:pointer}.note{margin-top:10px;padding:10px;border-radius:10px;background:#f7f7f7;font-size:13px}@media(max-width:700px){.meta{grid-template-columns:1fr 1fr}.actions{flex-wrap:wrap}}
</style></head><body><main class="wrap"><section class="head"><h1>🛡️ JORON Admin Support Center</h1><p>Customer Support Ticket পরিচালনা করুন। AI যেখানে নিশ্চিত নয়, সেসব বিষয় এখানে review করা হবে।</p><div class="toolbar"><select id="filter"><option value="all">সব Ticket</option><option value="open">Open</option><option value="pending_admin">Pending Admin</option><option value="in_progress">In Progress</option><option value="resolved">Resolved</option></select><button id="refresh" class="btn btn-gold">↻ Refresh</button></div><div id="notice" class="note">Admin access যাচাই হচ্ছে…</div></section><section id="list" class="list"></section></main><script type="module">import{auth,onAuthStateChanged,persistenceReady}from'./assets/firebase-client.js';const ADMIN_UID='PcDehBv4dYezeIPA6h0Peo9lpih2';const BASE='https://us-central1-joron-d7742.cloudfunctions.net';const list=document.getElementById('list'),filter=document.getElementById('filter'),notice=document.getElementById('notice');let user=null;const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));async function load(){if(!user||user.uid!==ADMIN_UID)return;list.innerHTML='<div class="card">⏳ Tickets লোড হচ্ছে…</div>';try{const r=await fetch(BASE+'/adminListSupportTickets',{headers:{Authorization:'Bearer '+await user.getIdToken(true)}});const d=await r.json();if(!r.ok||!d.ok)throw Error(d.error||'Load failed');let rows=d.tickets||[];if(filter.value!=='all')rows=rows.filter(x=>x.status===filter.value);if(!rows.length){list.innerHTML='<div class="card">🎉 এই filter-এ কোনো Ticket নেই।</div>';return}list.innerHTML=rows.map(t=>`<article class="ticket card"><h2>${esc(t.subject)}</h2><div class="meta"><div>Ticket<br><strong>${esc(t.ticketId)}</strong></div><div>Category<br><strong>${esc(t.category)}</strong></div><div>Priority<br><strong>${esc(t.priority)}</strong></div><div>Status<br><strong>${esc(t.status)}</strong></div></div><p>${esc(t.message)}</p><p class="note">AI summary: ${esc(t.aiSummary||'এখনো নেই')}<br>Escalation: ${esc(t.escalationReason||'—')}</p><textarea data-reply="${esc(t.ticketId)}" placeholder="Customer-কে Admin reply লিখুন…"></textarea><div class="actions"><button class="btn" data-status="in_progress" data-id="${esc(t.ticketId)}">In Progress</button><button class="btn" data-status="resolved" data-id="${esc(t.ticketId)}">✅ Resolved</button><button class="btn" data-reply-send="${esc(t.ticketId)}">Reply পাঠান</button></div></article>`).join('')}catch(e){console.error(e);list.innerHTML='<div class="card">⚠️ Support function এখনো deploy/configure করা হয়নি বা access denied।</div>'}}async function post(path,body){const r=await fetch(BASE+'/'+path,{method:'POST',headers:{Authorization:'Bearer '+await user.getIdToken(true),'Content-Type':'application/json'},body:JSON.stringify(body)});const d=await r.json();if(!r.ok||!d.ok)throw Error(d.error||'Request failed');return d}list.addEventListener('click',async e=>{const b=e.target.closest('button');if(!b)return;try{if(b.dataset.status)await post('adminUpdateSupportTicket',{ticketId:b.dataset.id,status:b.dataset.status});if(b.dataset.replySend){const ta=document.querySelector(`textarea[data-reply="${CSS.escape(b.dataset.replySend)}"]`);const text=ta?.value.trim();if(!text)return alert('Reply লিখুন।');await post('adminReplySupportTicket',{ticketId:b.dataset.replySend,text})}notice.textContent='✅ Update সফল হয়েছে।';await load()}catch(err){notice.textContent='⚠️ '+err.message}});filter.onchange=load;document.getElementById('refresh').onclick=load;await persistenceReady;onAuthStateChanged(auth,u=>{user=u;if(!u){notice.textContent='🔒 Admin login প্রয়োজন।';list.innerHTML='';return}if(u.uid!==ADMIN_UID){notice.textContent='⛔ এই account-এর Admin permission নেই।';list.innerHTML='';return}notice.textContent='🟢 Admin authenticated';load()});</script></body></html>
