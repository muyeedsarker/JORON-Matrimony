<!doctype html><html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>JORON | Support Request</title><link rel="stylesheet" href="assets/joron-theme-2026.css"><link rel="stylesheet" href="assets/joron-polish-2026.css"><style>body{background:linear-gradient(135deg,#fff7fa,#f2fbf7);font-family:system-ui,"Noto Sans Bengali",sans-serif}.wrap{max-width:760px;margin:auto;padding:24px 16px}.card{background:#fff;border-radius:24px;padding:24px;box-shadow:0 12px 35px #0000000d}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field{display:flex;flex-direction:column;gap:6px}.field.full{grid-column:1/-1}label{font-weight:700;font-size:14px}input,select,textarea{border:1px solid #ddd;border-radius:12px;padding:12px;font:inherit}textarea{min-height:140px;resize:vertical}.actions{display:flex;gap:10px;margin-top:16px}.notice{margin-top:14px;padding:12px;border-radius:12px;background:#f8f8f8}@media(max-width:600px){.grid{grid-template-columns:1fr}.field.full{grid-column:auto}}</style></head><body><header class="site-header"><div class="container nav-wrap"><a class="brand" href="index.html"><span><strong>JORON</strong><small>সম্পর্ক জুড়ে দেয় জোড়ন</small></span></a><nav class="main-nav"><a href="ai-support.html">AI Support</a><a href="help.html">Help Center</a><a href="dashboard.html">Dashboard</a></nav></div></header><main class="wrap"><section class="card"><span class="eyebrow">SUPPORT TICKET</span><h1>মানুষের সহায়তা প্রয়োজন?</h1><p>AI উত্তর না দিলে বা payment, fraud, privacy, safety কিংবা account সমস্যায় এখানে Support Request পাঠান।</p><form id="form"><div class="grid"><div class="field"><label>বিষয়</label><select id="category"><option value="account">Account</option><option value="profile">Profile</option><option value="biodata">Biodata</option><option value="matching">Matching</option><option value="membership">Membership</option><option value="payment">Payment</option><option value="privacy">Privacy</option><option value="safety">Safety / Report</option><option value="technical">Technical</option><option value="other">Other</option></select></div><div class="field"><label>Priority</label><select id="priority"><option value="normal">Normal</option><option value="high">High</option><option value="urgent">Urgent</option></select></div><div class="field full"><label>সংক্ষিপ্ত বিষয়</label><input id="subject" maxlength="120" required placeholder="যেমন: Payment verification হয়নি"></div><div class="field full"><label>বিস্তারিত</label><textarea id="message" maxlength="3000" required placeholder="সমস্যাটি বিস্তারিত লিখুন। Password, OTP বা PIN লিখবেন না।"></textarea></div></div><div class="actions"><button class="btn btn-gold" type="submit">Support Ticket পাঠান</button><a class="btn" href="ai-support.html">AI Support</a></div></form><div id="out" class="notice" hidden></div></section></main><script type="module">import {auth,db} from './assets/firebase-client.js';import {onAuthStateChanged} from 'https://www.gstatic.com/firebasejs/12.16.0/firebase-auth.js';import {addDoc,collection,serverTimestamp} from 'https://www.gstatic.com/firebasejs/12.16.0/firebase-firestore.js';const form=document.getElementById('form'),out=document.getElementById('out');let uid=null;onAuthStateChanged(auth,u=>{uid=u?.uid||null});form.addEventListener('submit',async e=>{e.preventDefault();out.hidden=false;if(!uid){out.textContent='Support Ticket পাঠাতে আগে Login করুন।';return}const category=document.getElementById('category').value,priority=document.getElementById('priority').value,subject=document.getElementById('subject').value.trim(),message=document.getElementById('message').value.trim();try{const ref=await addDoc(collection(db,'supportTickets'),{uid,category,priority,subject,message,status:'open',source:'web',aiSummary:'',aiConfidence:0,escalationReason:null,assignedAdminUid:null,createdAt:serverTimestamp(),updatedAt:serverTimestamp(),lastReplyAt:null});await addDoc(collection(db,'supportMessages'),{ticketId:ref.id,senderType:'customer',senderUid:uid,text:message,createdAt:serverTimestamp()});out.textContent='আপনার Support Ticket তৈরি হয়েছে: '+ref.id;form.reset()}catch(err){console.error(err);out.textContent='Ticket পাঠানো যায়নি। কিছুক্ষণ পর আবার চেষ্টা করুন।'}});</script></body></html>
