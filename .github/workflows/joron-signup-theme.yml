name: JORON Signup Theme Sync
on:
  push:
    branches: [main]
    paths:
      - 'signup.html'
      - 'assets/joron-signup-2026.css'
      - '.github/workflows/joron-signup-theme.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  sync-signup-theme:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply signup production theme
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('signup.html')
          s=p.read_text(encoding='utf-8')
          import re
          s=re.sub(r'<style>.*?</style>\s*', '', s, count=1, flags=re.S)
          tag='<link rel="stylesheet" href="assets/joron-signup-2026.css?v=2026">'
          if tag not in s:
              marker='<link rel="stylesheet" href="assets/joron-global-2026.css?v=2026">'
              if marker in s:
                  s=s.replace(marker, marker+'\n'+tag, 1)
              else:
                  s=s.replace('</head>', tag+'\n</head>', 1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit if changed
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add signup.html
          git diff --cached --quiet || git commit -m 'Apply JORON signup production theme'
          git push
