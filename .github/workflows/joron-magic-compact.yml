name: JORON Magic compact buttons
on:
  push:
    branches: [main]
    paths:
      - 'magic-features.html'
      - 'assets/joron-magic-compact-2026.css'
      - '.github/workflows/joron-magic-compact.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inject compact Magic/Features CSS
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('magic-features.html')
          s=p.read_text(encoding='utf-8')
          link='<link rel="stylesheet" href="assets/joron-magic-compact-2026.css?v=2026">'
          if link not in s:
              s=s.replace('</head>', link+'\n</head>', 1)
              p.write_text(s, encoding='utf-8')
          PY
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add magic-features.html
          git diff --cached --quiet || git commit -m 'UI: compact Magic and Features buttons'
          git push
