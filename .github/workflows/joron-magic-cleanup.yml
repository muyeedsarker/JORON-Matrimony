name: JORON Magic — Country Language Cleanup

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  inject-magic-cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ensure Magic cleanup script is loaded
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('magic-features.html')
          if not p.exists():
              raise SystemExit('magic-features.html not found')
          s = p.read_text(encoding='utf-8')
          tag = '<script src="assets/joron-magic-cleanup-2026.js?v=2026"></script>'
          if tag not in s:
              s = s.replace('</body>', tag + '\n</body>')
              p.write_text(s, encoding='utf-8')
          PY
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add magic-features.html
          git diff --cached --quiet || git commit -m 'Keep Country and Language selection off Magic page'
          git push
