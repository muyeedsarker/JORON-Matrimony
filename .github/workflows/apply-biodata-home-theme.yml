name: Apply Home Theme to Smart Biodata
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  polish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ensure Smart Biodata theme and onboarding handoff
        shell: python
        run: |
          from pathlib import Path
          p=Path('smart-biodata.html')
          s=p.read_text(encoding='utf-8')
          css='<link rel="stylesheet" href="assets/joron-onboarding-2026.css?v=2026">'
          if css not in s: s=s.replace('</head>',css+'\n</head>',1)
          bridge='<script src="assets/joron-smart-biodata-bridge.js?v=2026"></script>'
          if bridge not in s: s=s.replace('</body>',bridge+'\n</body>',1)
          p.write_text(s,encoding='utf-8')
      - name: Commit if changed
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add smart-biodata.html
          if git diff --cached --quiet; then echo 'No changes to commit.'; else git commit -m 'fix: connect onboarding data to Smart Biodata'; git push; fi
