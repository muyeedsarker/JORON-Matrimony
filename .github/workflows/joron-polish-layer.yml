name: JORON 2026 visual polish
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add polish stylesheet to site pages
        shell: python
        run: |
          from pathlib import Path
          changed=[]
          for p in Path('.').glob('*.html'):
              s=p.read_text(encoding='utf-8')
              if 'assets/joron-polish-2026.css' in s:
                  continue
              marker='</head>'
              if marker in s:
                  s=s.replace(marker,'<link rel="stylesheet" href="assets/joron-polish-2026.css">\n</head>',1)
                  p.write_text(s,encoding='utf-8')
                  changed.append(str(p))
          print('Updated:', ', '.join(changed) if changed else 'none')
      - name: Commit applied layer
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add '*.html'
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'style: apply JORON 2026 polish layer [skip ci]'
          git push
