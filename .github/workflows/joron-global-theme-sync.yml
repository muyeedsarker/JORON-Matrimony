name: JORON Global Theme Sync

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-theme:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Apply master JORON visual layer to production pages
        shell: python
        run: |
          from pathlib import Path
          import re

          root = Path('.')
          marker = 'joron-global-2026.css'
          link = '<link rel="stylesheet" href="assets/joron-global-2026.css?v=2026">'
          changed = []

          excluded = {'index_backup_before_new_design.html'}
          for p in sorted(root.glob('*.html')):
              if p.name in excluded:
                  continue
              text = p.read_text(encoding='utf-8')
              original = text

              if marker not in text and '</head>' in text.lower():
                  text = re.sub(r'</head>', link + '\n</head>', text, count=1, flags=re.I)

              # All production browser chrome uses the approved primary purple.
              text = re.sub(r'(<meta[^>]+name=["\']theme-color["\'][^>]+content=["\'])#[0-9a-fA-F]{6}(["\'])', r'\g<1>#534AB7\g<2>', text, count=1, flags=re.I)

              if text != original:
                  p.write_text(text, encoding='utf-8')
                  changed.append(str(p))

          print('Theme-synced pages:', ', '.join(changed) if changed else 'none')

      - name: Commit synchronized production pages
        shell: bash
        run: |
          git config user.name "JORON Theme Bot"
          git config user.email "actions@users.noreply.github.com"
          git add '*.html'
          if git diff --cached --quiet; then
            echo "No page changes needed."
          else
            git commit -m "Apply JORON master visual system to production pages"
            git push
          fi
