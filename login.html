<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#5b1230">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<title>JORON Matrimony — Login</title>
<link rel="stylesheet" href="assets/joron-theme-2026.css">
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;min-height:100%;font-family:"Hind Siliguri","Noto Sans Bengali",system-ui,sans-serif;background:#4f1029;color:#fff}body{background:linear-gradient(145deg,#4f1029,#8f164c 58%,#d71965)}.login-page{min-height:100dvh;display:flex;justify-content:center;align-items:center}.login-shell{width:min(100%,480px);min-height:100dvh;display:flex;flex-direction:column;background:#5b1230;box-shadow:0 0 35px rgba(40,5,20,.35)}.hero{height:43dvh;min-height:250px;overflow:hidden;background:#5b1230}.hero img{width:100%;height:100%;display:block;object-fit:cover;object-position:center 10%}.login-panel{flex:1;text-align:center;padding:10px 18px 14px;background:linear-gradient(180deg,#5b1230,#791642 58%,#a71959);border-top:1px solid rgba(240,191,93,.45)}.welcome{margin:0 0 6px;color:#ffe6a6;font-size:14px;font-weight:800}.msg{min-height:20px;color:#ffd7e8;font-size:11px;font-weight:800}.btn{width:100%;min-height:44px;border-radius:24px;margin:5px 0;border:2px solid rgba(255,255,255,.65);font-size:14px;font-weight:800;display:flex;align-items:center;justify-content:center;gap:9px;cursor:pointer;box-shadow:0 5px 14px rgba(35,5,20,.22)}.fb{background:#1877f2;color:#fff;border-color:#7bb0ff}.google{background:#fff;color:#242424;border-color:#fff}.idbtn{background:linear-gradient(135deg,#c99b3d,#ed236f);color:#fff;border-color:#f1c96d}.otpbtn{background:linear-gradient(135deg,#7b42b8,#e51a68);color:#fff;border-color:#d7a0ff}.icon{font-size:18px;font-weight:900}.divider{display:flex;align-items:center;gap:9px;margin:6px 0;color:#ffe4a0;font-size:12px;font-weight:800}.divider:before,.divider:after{content:"";height:1px;background:rgba(255,226,158,.55);flex:1}.terms{margin:7px 6px 0;color:#ffe8ef;font-size:9.5px;line-height:1.4}.terms a{color:#ffd76f;font-weight:800}.homeback{display:flex;justify-content:center;gap:14px;margin-top:7px;font-size:10.5px}.homeback a{color:#fff;text-decoration:none}.email-form{display:none;text-align:left;margin-top:7px;padding:10px;border-radius:14px;background:#fff4f8;border:1px solid #e5a9c2}.email-form label{display:block;margin:4px 0;font-size:11px;font-weight:800;color:#5c2038}.email-form input{width:100%;height:40px;border:1px solid #d8bf99;border-radius:10px;padding:0 10px;background:#fff;color:#35251f}.small{min-height:40px!important;font-size:12px!important}@media(min-width:600px){.login-shell{min-height:calc(100dvh - 28px);border-radius:24px;overflow:hidden}}@media(max-width:390px){.hero{height:40dvh;min-height:220px}.login-panel{padding:7px 14px 10px}.btn{min-height:40px;font-size:13px;margin:4px 0}.welcome{font-size:13px}.terms{font-size:9px}.homeback{font-size:10px}}
</style>
</head>
<body>
<main class="login-page"><section class="login-shell" aria-label="JORON Login">
<div class="hero"><img src="assets/couple.png" alt="JORON Matrimony Couple" loading="eager"></div>
<div class="login-panel">
<p class="welcome">ভালোবাসার সম্পর্ককে বিয়ের বন্ধনে জুড়ে দেয় JORON</p>
<div id="msg" class="msg" aria-live="polite"></div>
<button class="btn fb" id="facebookBtn" type="button"><span class="icon">f</span> Continue With Facebook</button>
<button class="btn google" id="googleBtn" type="button"><span class="icon">G</span> Continue With Google</button>
<div class="divider">অথবা</div>
<button class="btn idbtn" id="idLoginBtn" type="button"><span class="icon">👤</span> Login with ID / Mobile / Email</button>
<button class="btn otpbtn" id="otpLoginBtn" type="button"><span class="icon">📱</span> Login with Mobile OTP</button>
<form id="emailForm" class="email-form">
<label for="email">📧 Member ID / Mobile / Email</label><input id="email" type="text" autocomplete="username" placeholder="Member ID / মোবাইল / ইমেইল" required>
<label for="password">🔒 Password</label><input id="password" type="password" autocomplete="current-password" placeholder="আপনার পাসওয়ার্ড লিখুন" required>
<button class="btn idbtn small" type="submit">🔐 নিরাপদে লগইন করুন</button>
<button type="button" id="forgot" class="btn google small">পাসওয়ার্ড ভুলে গেছেন?</button>
</form>
<p class="terms">By logging in, you accept our <a href="terms.html">Terms of service</a> and <a href="privacy.html">privacy policy</a>.</p>
<div class="homeback"><a href="index.html">🏠 হোম</a><a href="signup.html">নতুন সদস্য? অ্যাকাউন্ট তৈরি করুন</a></div>
</div></section></main>
<script src="assets/joron-language.js"></script>
<script type="module">
import{auth,persistenceReady,signInWithCustomToken,ensureUserProfile}from'./assets/firebase-client.js';
import{GoogleAuthProvider,FacebookAuthProvider,signInWithRedirect,getRedirectResult}from'https://www.gstatic.com/firebasejs/12.16.0/firebase-auth.js';
const $=id=>document.getElementById(id),msg=$('msg'),form=$('emailForm');
const googleProvider=new GoogleAuthProvider(),facebookProvider=new FacebookAuthProvider();
googleProvider.setCustomParameters({prompt:'select_account'});facebookProvider.setCustomParameters({display:'popup'});
const params=new URLSearchParams(location.search),rawNext=params.get('next');
const next=rawNext&&/^(?!\/\/)(?![a-z][a-z0-9+.-]*:)[^\\\s]*$/i.test(rawNext)&&!rawNext.startsWith('//')&&!rawNext.includes('..')?rawNext:null;
const setMsg=t=>{msg.textContent=t},go=()=>location.replace(next||'biodata.html');
const friendly=e=>{const c=e?.code||e?.message||'';const map={'auth/invalid-credential':'Member ID/মোবাইল/ইমেইল অথবা পাসওয়ার্ড সঠিক নয়।','auth/popup-closed-by-user':'লগইন উইন্ডো বন্ধ করা হয়েছে।','auth/popup-blocked':'ব্রাউজার popup বন্ধ করেছে।','auth/unauthorized-domain':'এই ওয়েবসাইটের domain Firebase Authentication-এ অনুমোদিত নয়। Firebase Console থেকে domain অনুমোদন করতে হবে।','auth/operation-not-allowed':'Firebase Console-এ এই Login Provider চালু করা হয়নি।','auth/account-exists-with-different-credential':'এই ইমেইলে অন্য একটি Login method-এর অ্যাকাউন্ট আছে।','auth/network-request-failed':'ইন্টারনেট সংযোগ পরীক্ষা করে আবার চেষ্টা করুন।','AUTH_SERVICE_UNAVAILABLE':'নিরাপদ লগইন সেবা এখন সাময়িকভাবে পাওয়া যাচ্ছে না।'};return map[c]||'লগইন সম্পন্ন করা যায়নি। আবার চেষ্টা করুন।'};
async function postJson(url,body){const r=await fetch(url,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});let d={};try{d=await r.json()}catch{}if(!r.ok)throw new Error(d?.error||'AUTH_SERVICE_UNAVAILABLE');return d}
async function oauthRedirect(provider,label){try{await persistenceReady;setMsg('⏳ '+label+' দিয়ে নিরাপদে লগইন হচ্ছে...');await signInWithRedirect(auth,provider)}catch(e){console.error(e);setMsg('❌ '+friendly(e))}}
async function finishRedirect(){try{await persistenceReady;const r=await getRedirectResult(auth);if(!r?.user)return;const provider=r.credential?.providerId||r.user.providerData?.[0]?.providerId||'oauth';await ensureUserProfile(r.user,provider);setMsg('✅ লগইন সফল হচ্ছে...');setTimeout(go,300)}catch(e){console.error('JORON OAuth redirect error:',e);setMsg('❌ '+friendly(e))}}
$('facebookBtn').onclick=()=>oauthRedirect(facebookProvider,'Facebook');$('googleBtn').onclick=()=>oauthRedirect(googleProvider,'Google');
$('otpLoginBtn').onclick=()=>location.href='otp-login.html'+(next?'?next='+encodeURIComponent(next):'');
$('idLoginBtn').onclick=()=>{form.style.display=form.style.display==='block'?'none':'block';if(form.style.display==='block')$('email').focus()};
form.addEventListener('submit',async e=>{e.preventDefault();const identifier=$('email').value.trim(),password=$('password').value;if(!identifier||!password)return setMsg('Member ID, মোবাইল/ইমেইল এবং পাসওয়ার্ড দিন');try{setMsg('⏳ নিরাপদে লগইন হচ্ছে...');await persistenceReady;const d=await postJson('https://us-central1-joron-d7742.cloudfunctions.net/loginWithIdentifier',{identifier,password});if(!d.customToken)throw new Error('AUTH_SERVICE_UNAVAILABLE');await signInWithCustomToken(auth,d.customToken);setMsg('✅ লগইন সফল হচ্ছে...');setTimeout(go,400)}catch(e){console.error(e);setMsg('❌ '+friendly(e))}});
$('forgot').onclick=async()=>{const identifier=$('email').value.trim();if(!identifier)return setMsg('আগে Member ID / মোবাইল / ইমেইল লিখুন');try{setMsg('⏳ রিসেট তথ্য যাচাই হচ্ছে...');await postJson('https://us-central1-joron-d7742.cloudfunctions.net/passwordResetByIdentifier',{identifier});setMsg('✅ অ্যাকাউন্ট থাকলে রিসেট লিংক ইমেইলে পাঠানো হবে।')}catch(e){console.error(e);setMsg('❌ '+friendly(e))}};
finishRedirect();
</script></body></html>
