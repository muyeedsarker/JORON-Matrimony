<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#534AB7">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<title>JORON Matrimony — Login</title>
<link rel="stylesheet" href="assets/joron-theme-2026.css">
<link rel="stylesheet" href="assets/joron-polish-2026.css">
<link rel="stylesheet" href="assets/joron-global-2026.css?v=2026">
<link rel="stylesheet" href="assets/joron-login-2026.css?v=2026">
</head>
<body>
<main class="login-page"><section class="login-shell" aria-label="JORON Login">
<div class="hero"><img src="assets/couple.png" alt="JORON Matrimony Couple" loading="eager"></div>
<div class="login-panel">
<p class="welcome">ভালোবাসার সম্পর্ককে বিয়ের বন্ধনে জুড়ে দেয় JORON</p>
<div id="msg" class="msg" aria-live="polite"></div>
<button class="btn fb" id="facebookBtn" type="button"><span class="icon">f</span> Continue With Facebook</button>
<button class="btn google" id="googleBtn" type="button"><span class="icon">G</span> Continue With Google</button>
<div class="divider">অথবা</div>
<button class="btn idbtn" id="idLoginBtn" type="button" aria-expanded="false" aria-controls="emailForm"><span class="icon">👤</span> Login with ID / Mobile / Email</button>
<button class="btn otpbtn" id="otpLoginBtn" type="button"><span class="icon">📱</span> Login with Mobile OTP</button>
<form id="emailForm" class="email-form" novalidate>
<label for="email">📧 Member ID / Mobile / Email</label><input id="email" type="text" autocomplete="username" inputmode="text" placeholder="Member ID / মোবাইল / ইমেইল" required>
<label for="password">🔒 Password</label><input id="password" type="password" autocomplete="current-password" placeholder="আপনার পাসওয়ার্ড লিখুন" required>
<button class="btn idbtn small" type="submit">🔐 নিরাপদে লগইন করুন</button>
<button type="button" id="forgot" class="btn google small">পাসওয়ার্ড ভুলে গেছেন?</button>
</form>
<p class="terms">By logging in, you accept our <a href="terms.html">Terms of service</a> and <a href="privacy.html">privacy policy</a>.</p>
<div class="homeback"><a href="index.html">🏠 হোম</a><a href="signup.html">নতুন সদস্য? অ্যাকাউন্ট তৈরি করুন</a></div>
</div></section></main>
<script>window.JORON_LOGIN_NEXT=(new URLSearchParams(location.search)).get('next')||null;</script>
<script src="assets/joron-language.js"></script>
<script type="module">
import './assets/firebase-client.js';

const $=id=>document.getElementById(id);
const msg=$('msg'),form=$('emailForm'),idBtn=$('idLoginBtn'),otpBtn=$('otpLoginBtn');
const params=new URLSearchParams(location.search),rawNext=params.get('next');
const next=rawNext&&/^(?!\/\/)(?![a-z][a-z0-9+.-]*:)[^\\\s]*$/i.test(rawNext)&&!rawNext.startsWith('//')&&!rawNext.includes('..')?rawNext:null;

function showMessage(text){if(msg)msg.textContent=text;}

if(idBtn&&form){
  form.style.display='none';
  idBtn.addEventListener('click',()=>{
    const open=form.style.display==='block';
    form.style.display=open?'none':'block';
    idBtn.setAttribute('aria-expanded',String(!open));
    if(!open) $('email')?.focus();
  });
}

if(otpBtn){
  otpBtn.addEventListener('click',()=>{
    otpBtn.disabled=true;
    location.href='otp-login.html'+(next?'?next='+encodeURIComponent(next):'');
  });
}

/* firebase-client.js owns the authentication handlers. This page intentionally
   does not register a second submit/OAuth/reset handler, preventing duplicate
   Firebase requests and duplicate redirects. */
window.addEventListener('error',event=>{
  if(event?.message) console.error('JORON login page error:',event.message);
});

/* If the backend/Firebase handler reports an error, keep the page usable. */
if(form){
  form.addEventListener('invalid',()=>showMessage('প্রয়োজনীয় তথ্যগুলো সঠিকভাবে পূরণ করুন।'),true);
}
</script>
</body></html>
