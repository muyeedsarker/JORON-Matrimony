<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#534AB7">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<title>JORON Matrimony — Login</title>
<link rel="stylesheet" href="assets/joron-theme-2026.css">
<link rel="stylesheet" href="assets/joron-polish-2026.css">
<link rel="stylesheet" href="assets/joron-global-2026.css?v=2026">
<link rel="stylesheet" href="assets/joron-login-2026.css?v=2026">
</head>
<body>
<main class="login-page"><section class="login-shell" aria-label="JORON Login">
<div class="hero"><img src="assets/couple.png" alt="JORON Matrimony Couple" loading="eager"></div>
<div class="login-panel">
<p class="welcome">ভালোবাসার সম্পর্ককে বিয়ের বন্ধনে জুড়ে দেয় JORON</p>
<div id="msg" class="msg" aria-live="polite"></div>
<button class="btn fb" id="facebookBtn" type="button"><span class="icon">f</span> Continue With Facebook</button>
<button class="btn google" id="googleBtn" type="button"><span class="icon">G</span> Continue With Google</button>
<div class="divider">অথবা</div>
<button class="btn idbtn" id="idLoginBtn" type="button"><span class="icon">👤</span> Login with ID / Mobile / Email</button>
<button class="btn otpbtn" id="otpLoginBtn" type="button"><span class="icon">📱</span> Login with Mobile OTP</button>
<form id="emailForm" class="email-form" novalidate>
<label for="email">📧 Member ID / Mobile / Email</label><input id="email" type="text" autocomplete="username" placeholder="Member ID / মোবাইল / ইমেইল" required>
<label for="password">🔒 Password</label><input id="password" type="password" autocomplete="current-password" placeholder="আপনার পাসওয়ার্ড লিখুন" required>
<button class="btn idbtn small" type="submit">🔐 নিরাপদে লগইন করুন</button>
<button type="button" id="forgot" class="btn google small">পাসওয়ার্ড ভুলে গেছেন?</button>
</form>
<p class="terms">By logging in, you accept our <a href="terms.html">Terms of service</a> and <a href="privacy.html">privacy policy</a>.</p>
<div class="homeback"><a href="index.html">🏠 হোম</a><a href="signup.html">নতুন সদস্য? অ্যাকাউন্ট তৈরি করুন</a></div>
</div></section></main>
<script src="assets/joron-language.js"></script>
<script type="module">
import{auth,persistenceReady,signInWithCustomToken,ensureUserProfile,signInWithEmailAndPassword,sendPasswordResetEmail}from'./assets/firebase-client.js';
import{GoogleAuthProvider,FacebookAuthProvider,signInWithPopup}from'https://www.gstatic.com/firebasejs/12.16.0/firebase-auth.js';
const $=id=>document.getElementById(id),msg=$('msg'),form=$('emailForm');
const googleProvider=new GoogleAuthProvider(),facebookProvider=new FacebookAuthProvider();googleProvider.setCustomParameters({prompt:'select_account'});facebookProvider.setCustomParameters({display:'popup'});
const params=new URLSearchParams(location.search),rawNext=params.get('next');const next=rawNext&&/^(?!\/\/)(?![a-z][a-z0-9+.-]*:)[^\\\s]*$/i.test(rawNext)&&!rawNext.startsWith('//')&&!rawNext.includes('..')?rawNext:null;
const setMsg=t=>{msg.textContent=t},go=()=>location.replace(next||'biodata.html');
const friendly=e=>{const c=e?.code||e?.message||'';const map={'auth/invalid-credential':'Member ID/মোবাইল/ইমেইল অথবা পাসওয়ার্ড সঠিক নয়।','auth/wrong-password':'পাসওয়ার্ড সঠিক নয়।','auth/user-not-found':'এই তথ্য দিয়ে কোনো অ্যাকাউন্ট পাওয়া যায়নি।','auth/invalid-email':'ইমেইল ঠিকানাটি সঠিক নয়।','auth/popup-closed-by-user':'লগইন উইন্ডো বন্ধ করা হয়েছে।','auth/popup-blocked':'ব্রাউজার popup বন্ধ করেছে। Popup অনুমতি দিয়ে আবার চেষ্টা করুন।','auth/unauthorized-domain':'এই ওয়েবসাইটের domain Firebase Authentication-এ অনুমোদিত নয়।','auth/operation-not-allowed':'Firebase Console-এ এই Login Provider চালু করা হয়নি।','auth/account-exists-with-different-credential':'এই ইমেইলে অন্য একটি Login method-এর অ্যাকাউন্ট আছে।','auth/network-request-failed':'ইন্টারনেট সংযোগ পরীক্ষা করে আবার চেষ্টা করুন।','auth/too-many-requests':'অনেকবার চেষ্টা হয়েছে। কিছুক্ষণ পরে আবার চেষ্টা করুন।','AUTH_SERVICE_UNAVAILABLE':'নিরাপদ লগইন সেবা এখন সাময়িকভাবে পাওয়া যাচ্ছে না।','INVALID_CREDENTIALS':'Member ID/মোবাইল/ইমেইল অথবা পাসওয়ার্ড সঠিক নয়।','IDENTIFIER_SERVICE_ERROR':'লগইন সার্ভিসে সাময়িক সমস্যা হয়েছে। আবার চেষ্টা করুন।'};return map[c]||'লগইন সম্পন্ন করা যায়নি। আবার চেষ্টা করুন।'};
async function postJson(url,body){const r=await fetch(url,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});let d={};try{d=await r.json()}catch{}if(!r.ok)throw new Error(d?.error||'IDENTIFIER_SERVICE_ERROR');return d}
async function oauthPopup(provider,label){try{await persistenceReady;setMsg('⏳ '+label+' দিয়ে নিরাপদে লগইন হচ্ছে...');const result=await signInWithPopup(auth,provider);await ensureUserProfile(result.user,label.toLowerCase()+'.com');setMsg('✅ লগইন সফল হচ্ছে...');setTimeout(go,300)}catch(e){console.error('JORON OAuth login error:',e);setMsg('❌ '+friendly(e))}}
$('facebookBtn').onclick=()=>oauthPopup(facebookProvider,'Facebook');$('googleBtn').onclick=()=>oauthPopup(googleProvider,'Google');$('otpLoginBtn').onclick=()=>location.href='otp-login.html'+(next?'?next='+encodeURIComponent(next):'');$('idLoginBtn').onclick=()=>{form.style.display=form.style.display==='block'?'none':'block';if(form.style.display==='block')$('email').focus()};
form.addEventListener('submit',async e=>{e.preventDefault();e.stopImmediatePropagation();const identifier=$('email').value.trim(),password=$('password').value;if(!identifier||!password)return setMsg('Member ID, মোবাইল/ইমেইল এবং পাসওয়ার্ড দিন');try{setMsg('⏳ নিরাপদে লগইন হচ্ছে...');await persistenceReady;const isEmail=/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(identifier);if(isEmail){await signInWithEmailAndPassword(auth,identifier.toLowerCase(),password)}else{const d=await postJson('https://us-central1-joron-d7742.cloudfunctions.net/loginWithIdentifier',{identifier,password});if(!d.customToken)throw new Error('INVALID_CREDENTIALS');await signInWithCustomToken(auth,d.customToken)}await ensureUserProfile(auth.currentUser,'password');setMsg('✅ লগইন সফল হচ্ছে...');setTimeout(go,400)}catch(e){console.error('JORON login error:',e);setMsg('❌ '+friendly(e))}});
$('forgot').onclick=async()=>{const identifier=$('email').value.trim();if(!identifier)return setMsg('আগে Member ID / মোবাইল / ইমেইল লিখুন');try{setMsg('⏳ রিসেট তথ্য যাচাই হচ্ছে...');if(/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(identifier)){await sendPasswordResetEmail(auth,identifier.toLowerCase())}else{await postJson('https://us-central1-joron-d7742.cloudfunctions.net/passwordResetByIdentifier',{identifier})}setMsg('✅ যদি অ্যাকাউন্টটি থাকে, রিসেট লিংক ইমেইলে পাঠানো হবে।')}catch(e){console.error('JORON reset error:',e);setMsg('❌ '+friendly(e))}};
</script></body></html>
