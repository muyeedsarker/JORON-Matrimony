<!doctype html><html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#64158f"><title>JORON Matrimony | সম্পর্ক</title><link rel="stylesheet" href="assets/joron-theme-2026.css"><style>body{background:linear-gradient(145deg,#fff 0%,#fff7fb 48%,#f5efff 100%)!important}.wrap{width:min(980px,92%);margin:auto;padding:24px 0 50px}.hero,.card{background:linear-gradient(145deg,#fff,#fffafd 55%,#f7efff);border:1px solid #eadfea;border-radius:24px;box-shadow:0 10px 28px rgba(70,25,90,.10);padding:22px;margin-bottom:18px}.hero{text-align:center}.hero h1,.card h2{color:#64158f}.hero p,.muted{color:#687078;font-size:13px}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}.tab{border:1px solid #d8c1ed;background:#fff;border-radius:999px;padding:10px 14px;font-weight:800;color:#64158f;cursor:pointer;touch-action:manipulation}.tab.active{background:#64158f;color:#fff}.list{display:grid;gap:12px}.item{background:#fff;border:1px solid #eadfea;border-radius:18px;padding:16px;display:flex;justify-content:space-between;gap:14px;align-items:center}.item h3{margin:0;color:#30143f}.meta{font-size:12px;color:#687078;line-height:1.7}.actions{display:flex;gap:7px;flex-wrap:wrap}.btn{border:0;border-radius:12px;padding:10px 14px;font-weight:800;cursor:pointer;text-decoration:none}.profile{background:#f0e3ff;color:#64158f}.accept{background:#087b59;color:#fff}.reject{background:#fff1f1;color:#a80000}.status{padding:12px;border-radius:12px;background:#f8f3fb;color:#687078;font-size:13px}@media(max-width:620px){.item{display:block}.actions{margin-top:12px}.btn{width:100%}.tabs{display:grid;grid-template-columns:1fr 1fr}.tab{width:100%;padding:12px 8px}}</style><style id="joron-brand-final-v3">.site-header .brand,.site-header .brand>span:last-child,.brand{display:flex!important;align-items:center!important}.site-header .brand{gap:0!important;min-width:0!important}.site-header .brand-mark{display:none!important}.site-header .brand>span:last-child{flex-direction:column!important;align-items:center!important;justify-content:center!important;text-align:center!important;min-width:150px!important;max-width:210px!important;overflow:hidden!important}.site-header .brand strong{display:block!important;width:100%!important;font-size:40px!important;line-height:1!important;letter-spacing:2px!important;white-space:nowrap!important;text-align:center!important}.site-header .brand small{display:block!important;width:100%!important;margin-top:5px!important;font-family:"Hind Siliguri","Noto Sans Bengali",system-ui,sans-serif!important;font-size:14px!important;line-height:1.25!important;font-weight:700!important;letter-spacing:0!important;color:var(--gold-deep)!important;white-space:nowrap!important;text-align:center!important;overflow:hidden!important;text-overflow:clip!important}@media(max-width:650px){.site-header .brand>span:last-child{min-width:132px!important;max-width:180px!important}.site-header .brand strong{font-size:31px!important;letter-spacing:1.5px!important}.site-header .brand small{font-size:11px!important;margin-top:4px!important}}@media(max-width:390px){.site-header .brand>span:last-child{min-width:120px!important;max-width:165px!important}.site-header .brand strong{font-size:28px!important}.site-header .brand small{font-size:10px!important}}</style><link rel="stylesheet" href="assets/joron-polish-2026.css">
</head><body><header class="site-header"><div class="container nav-wrap"><a class="brand" href="index.html"><span><strong>JORON</strong><small>সম্পর্ক জুড়ে দেয় জোড়ন</small></span></a><nav class="main-nav"><a href="index.html">হোম</a><a href="profiles.html">প্রোফাইল</a><a href="matching.html">ম্যাচিং</a><a href="relationship.html">সম্পর্ক</a><a class="btn btn-gold" href="dashboard.html">Dashboard</a></nav></div></header><main class="wrap"><section class="hero"><h1>❤️ সম্পর্ক জুড়ে দিন</h1><p>আপনার পাঠানো ও পাওয়া Interest এখানে নিরাপদভাবে পরিচালনা করুন।</p><div class="tabs"><button type="button" class="tab active" data-tab="received">📥 পাওয়া Interest</button><button type="button" class="tab" data-tab="sent">📤 পাঠানো Interest</button></div></section><section class="card"><div id="status" class="status">সম্পর্কের তথ্য লোড হচ্ছে…</div><div id="list" class="list"></div></section></main><script type="module">import{auth,db,onAuthStateChanged,persistenceReady}from'./assets/firebase-client.js';import{collection,query,where,getDocs,doc,getDoc,updateDoc,deleteDoc}from'https://www.gstatic.com/firebasejs/12.16.0/firebase-firestore.js';const status=document.getElementById('status'),list=document.getElementById('list'),tabs=[...document.querySelectorAll('.tab')];let uid='',received=[],sent=[],tab='received';const esc=v=>String(v??'—').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function render(){const rows=tab==='received'?received:sent;tabs.forEach(b=>{const active=b.dataset.tab===tab;b.classList.toggle('active',active);b.setAttribute('aria-selected',String(active))});status.textContent=rows.length?`${rows.length}টি ${tab==='received'?'পাওয়া':'পাঠানো'} Interest`:'এখনও কোনো Interest নেই।';list.innerHTML=rows.map(x=>`<article class="item"><div><h3>${esc(x.profile?.name||'JORON Member')}</h3><div class="meta">${x.profile?.age?esc(x.profile.age)+' বছর · ':''}${esc(x.profile?.district||'')} · Status: ${esc(x.status)}</div></div><div class="actions"><a class="btn profile" href="profile.html?id=${encodeURIComponent(tab==='received'?x.fromUserId:x.profileId)}">Profile</a>${tab==='received'&&x.status==='pending'?`<button type="button" class="btn accept" data-action="accepted" data-id="${esc(x.id)}">✓ গ্রহণ</button><button type="button" class="btn reject" data-action="rejected" data-id="${esc(x.id)}">✕ প্রত্যাখ্যান</button>`:''}${tab==='sent'&&x.status==='pending'?`<button type="button" class="btn reject" data-delete="${esc(x.id)}">Interest বাতিল</button>`:''}</div></article>`).join('')}async function profile(id){try{const s=await getDoc(doc(db,'publicProfiles',id));return s.exists()?s.data():{name:'JORON Member',id}}catch{return{name:'JORON Member',id}}}async function load(){if(!uid)return;status.textContent='তথ্য লোড হচ্ছে…';try{const[r,s]=await Promise.all([getDocs(query(collection(db,'interests'),where('profileId','==',uid))),getDocs(query(collection(db,'interests'),where('fromUserId','==',uid)))]);received=await Promise.all(r.docs.map(async d=>({...d.data(),id:d.id,profile:await profile(d.data().fromUserId)})));sent=await Promise.all(s.docs.map(async d=>({...d.data(),id:d.id,profile:await profile(d.data().profileId)})));render()}catch(e){console.error('JORON relationship load error:',e);status.textContent='❌ সম্পর্কের তথ্য লোড করা যাচ্ছে না।';list.innerHTML='<div class="empty">আবার চেষ্টা করুন।</div>'}}tabs.forEach(b=>b.addEventListener('click',()=>{tab=b.dataset.tab;render()}));list.addEventListener('click',async e=>{const b=e.target.closest('button[data-action],button[data-delete]');if(!b)return;b.disabled=true;try{if(b.dataset.action){await updateDoc(doc(db,'interests',b.dataset.id),{status:b.dataset.action,updatedAt:new Date()})}else if(b.dataset.delete){if(!confirm('এই Interest বাতিল করবেন?')){b.disabled=false;return}await deleteDoc(doc(db,'interests',b.dataset.delete))}await load()}catch(err){console.error('JORON relationship action error:',err);b.disabled=false;alert('পরিবর্তন করা যায়নি।')}});async function start(){try{await persistenceReady;onAuthStateChanged(auth,user=>{if(!user){location.replace('login.html?next=relationship.html');return}uid=user.uid;load()})}catch(e){console.error('JORON auth persistence error:',e);status.textContent='❌ লগইন সেশন প্রস্তুত করা যায়নি।'}}start();</script></body></html>
