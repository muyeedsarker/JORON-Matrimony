<!doctype html><html lang="bn"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#fbf7ef"><title>J❤️R❤️N | Following</title><link rel="stylesheet" href="assets/joron-theme-2026.css"><style>body{background:#fbf7ef}.following-wrap{width:min(1000px,92%);margin:auto;padding:28px 0}.following-hero{text-align:center;margin-bottom:22px}.following-hero h1{color:#8d682d;margin:0;font-family:"Noto Serif Bengali",serif}.following-card{background:#fffdf8;border:1px solid #dfcda8;border-radius:20px;padding:20px;box-shadow:0 10px 26px rgba(150,110,50,.08)}.status{text-align:center;padding:22px;color:#746e65;font-weight:700}.list{display:grid;grid-template-columns:repeat(3,1fr);gap:15px}.profile-card{background:#fffdf8;border:1px solid #dfcda8;border-radius:20px;padding:18px;text-align:center}.avatar{width:70px;height:70px;margin:auto;border-radius:50%;display:grid;place-items:center;background:#f5ead4;color:#8d682d;font-size:27px;font-weight:900}.profile-card h2{margin:9px 0 3px;color:#8d682d;font-size:19px}.meta{color:#746e65;font-size:12px}.view{display:block;margin-top:12px;padding:11px;border:1px solid #c79a45;border-radius:13px;color:#8d682d;background:#fffaf0;font-weight:800}@media(max-width:700px){.list{grid-template-columns:1fr 1fr}}@media(max-width:480px){.list{grid-template-columns:1fr}}</style><style id="joron-brand-final-v3">
.site-header .brand,.site-header .brand>span:last-child,.brand{display:flex!important;align-items:center!important}
.site-header .brand{gap:0!important;min-width:0!important}
.site-header .brand-mark{display:none!important}
.site-header .brand>span:last-child{flex-direction:column!important;align-items:center!important;justify-content:center!important;text-align:center!important;min-width:150px!important;max-width:210px!important;overflow:hidden!important}
.site-header .brand strong{display:block!important;width:100%!important;font-size:40px!important;line-height:1!important;letter-spacing:2px!important;white-space:nowrap!important;text-align:center!important}
.site-header .brand small{display:block!important;width:100%!important;margin-top:5px!important;font-family:"Hind Siliguri","Noto Sans Bengali",system-ui,sans-serif!important;font-size:14px!important;line-height:1.25!important;font-weight:700!important;letter-spacing:0!important;color:var(--gold-deep)!important;white-space:nowrap!important;text-align:center!important;overflow:hidden!important;text-overflow:clip!important}
@media(max-width:650px){.site-header .brand>span:last-child{min-width:132px!important;max-width:180px!important}.site-header .brand strong{font-size:31px!important;letter-spacing:1.5px!important}.site-header .brand small{font-size:11px!important;margin-top:4px!important}}

</style><link rel="stylesheet" href="assets/joron-polish-2026.css">
</head><body><main class="following-wrap"><section class="following-hero"><h1>👤 যাদের Follow করছেন</h1><p>আপনার Follow করা Profile-গুলো এখানে দেখুন।</p></section><section class="following-card"><div id="status" class="status">Following লোড হচ্ছে...</div><section id="list" class="list"></section></section></main><script type="module">import{auth,db,onAuthStateChanged,persistenceReady}from'./assets/firebase-client.js';import{doc,getDoc}from'https://www.gstatic.com/firebasejs/12.16.0/firebase-firestore.js';import{getFollowing}from'./assets/follow-service.js';const listEl=document.getElementById('list'),status=document.getElementById('status');const esc=v=>String(v??'').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;');async function load(){try{const follows=await getFollowing();if(!follows.length){status.textContent='আপনি এখনো কোনো Profile Follow করেননি।';return}const cards=[];for(const f of follows){const s=await getDoc(doc(db,'biodata',f.profileId));if(!s.exists())continue;const d=s.data(),name=d.name||'J❤️R❤️N User';cards.push(`<article class="profile-card"><div class="avatar">${esc(name.charAt(0))}</div><h2>${esc(name)}</h2><div class="meta">${esc(d.age||'—')} বছর • ${esc(d.gender||'—')} • ${esc(d.district||'—')}</div><a class="view" href="profile.html?id=${encodeURIComponent(f.profileId)}">প্রোফাইল দেখুন →</a></article>`)}listEl.innerHTML=cards.join('');status.textContent=`${cards.length}টি Following Profile`;if(!cards.length)status.textContent='Follow করা Profile পাওয়া যায়নি।'}catch(e){console.error(e);status.textContent='Following লোড করা যায়নি।'}}await persistenceReady;onAuthStateChanged(auth,u=>{if(u)load();else{status.textContent='Following দেখতে Login করুন।';setTimeout(()=>location.href='login.html?next='+encodeURIComponent(location.href),700)}});</script></body></html>
