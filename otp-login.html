<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#534AB7"><title>JORON — Mobile OTP Login</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100dvh;font-family:"Hind Siliguri","Noto Sans Bengali",system-ui,sans-serif;background:linear-gradient(145deg,#fffaf2,#fdebf0 55%,#fff5df);color:#35251f}.wrap{width:min(100%,480px);min-height:100dvh;margin:auto;background:#fffaf2;display:flex;flex-direction:column}.top{height:70px;display:flex;align-items:center;padding:0 22px;border-bottom:1px solid #eadbc9;font-size:22px;font-weight:800}.back{border:0;background:none;font-size:30px;margin-right:14px;cursor:pointer}.content{padding:42px 24px;text-align:center}.logo{width:150px;height:150px;margin:0 auto 28px;border:2px solid #f08b96;border-radius:50%;display:grid;place-items:center;background:#fff}.logo span{font-size:64px}.title{font-size:27px;margin:0 0 10px}.sub{font-size:15px;line-height:1.6;color:#654d42;margin:0 auto 25px;max-width:360px}.lang{display:flex;gap:8px;justify-content:center;margin-bottom:24px}.lang button{border:1px solid #e5a1a8;border-radius:18px;background:#fff;padding:7px 14px;font-weight:700;cursor:pointer}.lang button.active{background:#ef5960;color:#fff}.field{display:flex;height:56px;border:2px solid #19a55b;border-radius:16px;overflow:hidden;background:#fff;margin-bottom:14px}.prefix{min-width:105px;display:flex;align-items:center;justify-content:center;border-right:1px solid #ddd;font-weight:800;font-size:16px}.field input{flex:1;border:0;outline:0;padding:0 14px;font-size:18px}.btn{width:100%;height:52px;border:0;border-radius:27px;background:#ef5960;color:#fff;font-size:18px;font-weight:800;cursor:pointer;margin-top:6px}.btn:disabled{opacity:.6}.otp{display:none}.otp input{text-align:center;letter-spacing:9px;font-size:25px}.msg{min-height:24px;margin:12px 0;color:#d71965;font-size:13px;font-weight:700}.footer{margin-top:auto;padding:20px;text-align:center;border-top:1px dashed #d8c6b5;font-size:13px}
</style><link rel="stylesheet" href="assets/joron-polish-2026.css">
<link rel="stylesheet" href="assets/joron-global-2026.css?v=2026">
</head>
<body><main class="wrap"><header class="top"><button class="back" onclick="location.href='login.html'">‹</button><span data-t="titlebar">মোবাইল OTP লগইন</span></header><section class="content"><div class="logo"><span>💞</span></div><h1 class="title" data-t="title">OTP দিয়ে লগইন করুন</h1><p class="sub" data-t="sub">আপনার নিবন্ধিত মোবাইল নম্বর দিন। SMS-এর মাধ্যমে একটি OTP পাঠানো হবে।</p><div class="lang"><button data-lang="bn" class="active">বাংলা</button><button data-lang="en">English</button><button data-lang="hi">हिन्दी</button></div><div class="phone"><div class="field"><div class="prefix">🇧🇩 +880</div><input id="phone" inputmode="numeric" maxlength="11" autocomplete="tel" placeholder="01XXXXXXXXX"></div><button id="send" class="btn" data-t="send">Get OTP</button></div><div id="otpBox" class="otp"><div class="field"><input id="otp" inputmode="numeric" maxlength="6" autocomplete="one-time-code" placeholder="••••••"></div><button id="verify" class="btn" data-t="verify">Verify & Login</button></div><div id="msg" class="msg" aria-live="polite"></div></section><footer class="footer" data-t="footer">JORON Matrimony — নিরাপদ ও সম্মানজনক সম্পর্কের জন্য</footer></main>
<script>
const T={bn:{titlebar:'মোবাইল OTP লগইন',title:'OTP দিয়ে লগইন করুন',sub:'আপনার নিবন্ধিত মোবাইল নম্বর দিন। SMS-এর মাধ্যমে একটি OTP পাঠানো হবে।',send:'OTP নিন',verify:'OTP যাচাই করে লগইন',footer:'JORON Matrimony — নিরাপদ ও সম্মানজনক সম্পর্কের জন্য',invalid:'সঠিক ১১ সংখ্যার মোবাইল নম্বর দিন',sending:'OTP পাঠানোর প্রস্তুতি চলছে...',provider:'SMS সেবা এখনো সংযুক্ত করা হয়নি। Provider যুক্ত হলে SMS যাবে।',failed:'OTP পাঠানো যায়নি। আবার চেষ্টা করুন।',enterOtp:'৬ সংখ্যার OTP দিন',success:'লগইন সফল হচ্ছে...',security:'নিরাপত্তা যাচাই করা যাচ্ছে না। আবার চেষ্টা করুন।'},en:{titlebar:'Mobile OTP Login',title:'Login with OTP',sub:'Enter your registered mobile number. An OTP will be sent by SMS.',send:'Get OTP',verify:'Verify & Login',footer:'JORON Matrimony — Safe and respectful connections',invalid:'Enter a valid 11-digit mobile number',sending:'Preparing OTP...',provider:'SMS service is not connected yet. SMS will work after the provider is configured.',failed:'Could not send OTP. Please try again.',enterOtp:'Enter the 6-digit OTP',success:'Login successful...',security:'Security verification failed. Please try again.'},hi:{titlebar:'मोबाइल OTP लॉगिन',title:'OTP से लॉगिन करें',sub:'अपना पंजीकृत मोबाइल नंबर दें। SMS से OTP भेजा जाएगा।',send:'OTP प्राप्त करें',verify:'OTP सत्यापित करके लॉगिन',footer:'JORON Matrimony — सुरक्षित और सम्मानजनक रिश्तों के लिए',invalid:'सही 11 अंकों का मोबाइल नंबर दें',sending:'OTP तैयार किया जा रहा है...',provider:'SMS सेवा अभी कनेक्ट नहीं है। Provider कॉन्फ़िगर होने के बाद SMS जाएगा.',failed:'OTP नहीं भेजा जा सका। फिर कोशिश करें.',enterOtp:'6 अंकों का OTP दर्ज करें',success:'लॉगिन सफल हो रहा है...',security:'सुरक्षा सत्यापन विफल हुआ। फिर कोशिश करें.'}};
let lang='bn';const $=id=>document.getElementById(id);function tr(k){return T[lang][k]||k}function setLang(x){lang=x;document.documentElement.lang=x;document.querySelectorAll('[data-t]').forEach(e=>e.textContent=tr(e.dataset.t));document.querySelectorAll('.lang button').forEach(b=>b.classList.toggle('active',b.dataset.lang===x));}
document.querySelectorAll('.lang button').forEach(b=>b.onclick=()=>setLang(b.dataset.lang));
const next=new URLSearchParams(location.search).get('next');const API='https://us-central1-joron-d7742.cloudfunctions.net/';
let firebaseClientPromise;
async function getSecurityToken(){
  firebaseClientPromise ||= import('./assets/firebase-client.js');
  const mod=await firebaseClientPromise;
  const appCheckMod=await import('https://www.gstatic.com/firebasejs/12.16.0/firebase-app-check.js');
  const result=await appCheckMod.getToken(mod.appCheck,false);
  if(!result?.token) throw new Error('APP_CHECK_FAILED');
  return result.token;
}
async function phoneRequest(path,body){
  const token=await getSecurityToken();
  return fetch(API+path,{method:'POST',headers:{'Content-Type':'application/json','X-Firebase-AppCheck':token},body:JSON.stringify(body)});
}
function phoneValue(){return $('phone').value.replace(/\D/g,'');}
$('send').onclick=async()=>{const phone=phoneValue();if(!/^01\d{9}$/.test(phone))return $('msg').textContent=tr('invalid');$('send').disabled=true;$('msg').textContent=tr('sending');try{const r=await phoneRequest('sendLoginOtp',{phone});const d=await r.json().catch(()=>({}));if(!r.ok){if(d.error==='SMS_PROVIDER_NOT_CONFIGURED')throw new Error('provider');if(d.error==='APP_CHECK_REQUIRED')throw new Error('security');throw new Error('failed')}$('otpBox').style.display='block';$('msg').textContent='✓ OTP sent';$('otp').focus();}catch(e){$('msg').textContent=e.message==='provider'?tr('provider'):e.message==='security'?tr('security'):tr('failed')}finally{$('send').disabled=false}};
$('verify').onclick=async()=>{const phone=phoneValue(),otp=$('otp').value.trim();if(!/^\d{6}$/.test(otp))return $('msg').textContent=tr('enterOtp');$('verify').disabled=true;try{const r=await phoneRequest('verifyLoginOtp',{phone,otp});const d=await r.json().catch(()=>({}));if(!r.ok||!d.customToken)throw new Error(r.status===401?'failed':'failed');const mod=await firebaseClientPromise;await mod.persistenceReady;await mod.signInWithCustomToken(mod.auth,d.customToken);$('msg').textContent=tr('success');setTimeout(()=>location.href=(next&&next.startsWith('/')?next:'biodata.html'),500)}catch(e){$('msg').textContent=tr('failed')}finally{$('verify').disabled=false}};
</script></body></html>
