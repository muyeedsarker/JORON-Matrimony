<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#534AB7">
<title>JORON • Page Preview & Test Center</title>
<style>
:root{--gold:#c59a45;--deep:#7b571f;--bg:#fbf7ef;--card:#fffdf8;--ink:#2c2925}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Noto Sans Bengali",sans-serif}.wrap{width:min(1100px,94%);margin:auto}.top{padding:14px;text-align:center;background:#fffaf0;border-bottom:1px solid #dfcda8;color:var(--deep);font-weight:900}.head{padding:22px 0;text-align:center}.head h1{margin:0;color:var(--deep);font-size:clamp(25px,5vw,40px)}.head p{margin:8px 0;color:#665}.controls{display:flex;flex-wrap:wrap;gap:9px;justify-content:center;margin:16px 0}.btn{border:2px solid var(--gold);border-radius:999px;padding:10px 16px;background:var(--card);color:var(--deep);font-weight:900;cursor:pointer}.btn.primary{background:var(--gold);color:#fff;border-color:var(--deep)}.status{text-align:center;margin:12px 0;padding:10px;border:1px solid #dfcda8;border-radius:12px;background:#fffdf8;font-weight:800}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px;padding-bottom:30px}.card{background:var(--card);border:1px solid #dfcda8;border-radius:16px;padding:15px;box-shadow:0 6px 16px #7b571f12}.card h3{margin:0 0 5px;color:var(--deep);font-size:17px}.card small{display:block;color:#777;margin-bottom:12px}.actions{display:flex;gap:7px;flex-wrap:wrap}.actions a{display:inline-block;text-decoration:none;border:1px solid var(--gold);border-radius:999px;padding:7px 10px;color:var(--deep);font-weight:800;font-size:13px}.actions a:hover{background:#fff2d2}.ok{border-color:#5d9b69}.bad{border-color:#c65c5c}.preview{position:fixed;inset:0;background:#0008;display:none;z-index:10;padding:3vh 3vw}.preview.open{display:flex}.framebox{width:100%;height:100%;background:white;border-radius:14px;overflow:hidden;display:flex;flex-direction:column}.bar{padding:8px;background:#fffaf0;border-bottom:1px solid #ddd;display:flex;justify-content:space-between;gap:8px;align-items:center}.bar strong{color:var(--deep)}iframe{border:0;flex:1;width:100%}.print-note{font-size:12px;color:#777}@media(max-width:600px){.actions a{font-size:12px;padding:6px 9px}}
</style>
<link rel="stylesheet" href="assets/joron-polish-2026.css">
<link rel="stylesheet" href="assets/joron-global-2026.css?v=2026">
</head>
<body>
<div class="top">J❤️R❤️N • Page Preview & Test Center</div>
<div class="wrap">
<header class="head"><h1>JORON Auto Page Preview</h1><p>সব গুরুত্বপূর্ণ পেজ এক জায়গা থেকে Preview, Print Preview এবং Status Check করুন।</p></header>
<div class="controls"><button class="btn primary" id="start">▶️ Auto Preview</button><button class="btn" id="pause">⏸️ Pause</button><button class="btn" id="stop">⏹️ Stop</button><button class="btn" id="check">🔎 Check All</button></div>
<div class="status" id="status">Ready — একটি অপশন নির্বাচন করুন।</div>
<section class="grid" id="grid"></section>
</div>
<div class="preview" id="preview"><div class="framebox"><div class="bar"><strong id="frameTitle">Preview</strong><span><button class="btn" id="print">🖨️ Print</button> <button class="btn" id="close">✕ Close</button></span></div><iframe id="frame" title="JORON page preview"></iframe></div></div>
<script>
const pages=[
['Home','index.html'],['Profiles','profiles.html'],['Matching','matching.html'],['Login','login.html'],['Signup','signup.html'],['Biodata','biodata.html'],['Profile','profile.html'],['Smart Biodata','smart-biodata.html'],['Premium','premium.html'],['Payment','payment.html'],['Magic Features','magic-features.html'],['Preferences','preferences.html'],['Help','help.html'],['Terms','terms.html'],['Ads','ads.html'],['OTP Login','otp-login.html'],['Onboarding','onboarding.html']
];
const grid=document.getElementById('grid'),status=document.getElementById('status'),preview=document.getElementById('preview'),frame=document.getElementById('frame'),frameTitle=document.getElementById('frameTitle');
let timer=null,index=0,paused=false;
function render(){grid.innerHTML=pages.map((p,i)=>`<article class="card" id="card-${i}"><h3>${i+1}. ${p[0]}</h3><small>${p[1]}</small><div class="actions"><a href="${p[1]}" target="_blank">👁️ Open</a><a href="${p[1]}" target="_blank" onclick="setTimeout(()=>window.print(),800)">🖨️ Print</a><a href="#" onclick="openPreview(${i});return false">🖥️ Preview</a></div></article>`).join('')}
function openPreview(i){index=i;frameTitle.textContent=`${i+1}. ${pages[i][0]} — ${pages[i][1]}`;frame.src=pages[i][1];preview.classList.add('open');status.textContent=`Preview: ${pages[i][0]}`}
function autoNext(){if(paused)return;if(index>=pages.length){stop();status.textContent='✅ Auto Preview সম্পন্ন।';return}openPreview(index);index++;timer=setTimeout(autoNext,5000)}
function start(){stop();paused=false;index=0;status.textContent='▶️ Auto Preview চলছে — প্রতি ৫ সেকেন্ডে পরের পেজে যাবে।';autoNext()}
function stop(){if(timer){clearTimeout(timer);timer=null}paused=false}
document.getElementById('start').onclick=start;document.getElementById('stop').onclick=()=>{stop();status.textContent='⏹️ Auto Preview বন্ধ।'};document.getElementById('pause').onclick=()=>{paused=!paused;status.textContent=paused?'⏸️ Paused — Resume করতে Auto Preview চাপুন।':'▶️ Resuming…';if(!paused)autoNext()};document.getElementById('close').onclick=()=>{preview.classList.remove('open');frame.src='about:blank'};document.getElementById('print').onclick=()=>{try{frame.contentWindow.focus();frame.contentWindow.print()}catch(e){window.open(frame.src,'_blank')}};
document.getElementById('check').onclick=async()=>{status.textContent='🔎 Checking pages…';let ok=0;for(let i=0;i<pages.length;i++){try{const r=await fetch(pages[i][1],{method:'HEAD',cache:'no-store'});const c=document.getElementById(`card-${i}`);c.classList.toggle('ok',r.ok);c.classList.toggle('bad',!r.ok);if(r.ok)ok++}catch(e){document.getElementById(`card-${i}`).classList.add('bad')}}status.textContent=`✅ Check complete: ${ok}/${pages.length} pages responded successfully.`};render();
</script>
</body>
</html>
